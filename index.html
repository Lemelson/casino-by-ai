<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CASINO BY AI</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #050309;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      /* лёгкое тёмное окружение вокруг экрана */
      background:
        radial-gradient(circle at 50% 40%, #15102a 0%, #070411 70%, #030208 100%);
      font-family: monospace;
    }
    #screen {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* "корпус" аркадного автомата вокруг экрана */
      box-shadow:
        0 0 0 4px #1b1330,
        0 0 0 8px #2a1b4d,
        0 0 40px 10px rgba(123, 47, 247, 0.35);
      background: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
